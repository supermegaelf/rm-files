<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="<%= metaDescription %>" />
    <meta name="theme-color" content="#fff">
    <title>
        Surf VPN
    </title>
    <script>
        let panelData;
        try {
            panelData = '<%- panelData %>';
            panelData = JSON.parse(atob(panelData));
        } catch (error) {
            console.error('Error parsing panel data:', error);
            panelData = null;
        }

        function getSubscriptionUrl() {
            if (panelData && panelData.subscriptionUrl) {
                return panelData.subscriptionUrl;
            }
            
            const url = new URL(window.location.href);
            return url.origin + url.pathname;
        }

        const cleanUrl = getSubscriptionUrl();
        const happUrl = "happ://add/" + cleanUrl + "#Title";

        function handleUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const happUrlParam = urlParams.get("happ_url");
            if (happUrlParam) {
                window.location.href = happUrlParam;
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            handleUrlParameters();
        });

        const COLOR_SCHEME = '(prefers-color-scheme: dark)';
        const DEFAULT_THEME = 'system';
        const META_THEME_COLORS = { light: '#fff', dark: '#151515' };

        function getUserTheme() {
            return DEFAULT_THEME;
        }

        function setTheme(theme) {
            if (theme === 'system') {
                theme = window.matchMedia(COLOR_SCHEME).matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', theme);
            document
                .querySelector(`[name='theme-color']`)
                .setAttribute('content', META_THEME_COLORS[theme]);
        }

        setTheme(getUserTheme());
        window.matchMedia(COLOR_SCHEME).addEventListener('change', () => {
            if (getUserTheme() === 'system') setTheme('system');
        });

        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (window.Telegram?.WebApp) {
                    Telegram.WebApp.ready();
                    Telegram.WebApp.expand();
                }
            } catch (e) {
                console.warn('Telegram init error:', e);
            }
        })
    </script>

    <style>
        :root {
            --bs-body-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }

        /* ========== THEMES ========== */
        [data-bs-theme='light'] {
            --bs-body-bg: #fff;
            --my-gray-color: #f6f5f4;
            --my-dark-gray-color: #eaeaea;
            --my-alpha-gray-color: rgba(50, 50, 50, .75);
            --my-alpha-dark-gray-color: rgba(0, 0, 0, .15);
            --my-emphasis-focus-shadow-rgb: 0, 0, 0;
            --my-heading-color: rgb(30, 25, 20);
            --my-content-color: rgba(0, 0, 0, .65);
            --my-dropdown-bg: #fff;
            --my-dropdown-link-hover-bg: rgba(55, 53, 47, .05);
            --my-modal-bg: #fff;
        }

        [data-bs-theme='dark'] {
            --bs-body-bg: #151515;
            --my-gray-color: #232323;
            --my-dark-gray-color: #1c1c1c;
            --my-alpha-gray-color: rgba(255, 255, 255, .5);
            --my-alpha-dark-gray-color: rgba(255, 255, 255, .15);
            --my-emphasis-focus-shadow-rgb: 255, 255, 255;
            --my-heading-color: rgb(225, 225, 225);
            --my-content-color: rgba(255, 255, 255, .55);
            --my-dropdown-bg: #2c2c2c;
            --my-dropdown-link-hover-bg: rgba(255, 255, 255, .05);
            --my-modal-bg: #232323;
        }

        /* ========== LAYOUT & SPACING ========== */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
        }

        body > .my-container {
            flex: 1;
            padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0.5rem));
        }

        .my-container {
            max-width: 1024px;
            padding-left: 1rem;
            padding-right: 1rem;
            padding-bottom: 1rem;
        }

        .my-navbar {
            --bs-navbar-nav-link-padding-x: .75rem;
            padding-top: 1rem;
            padding-bottom: 0;
            border-bottom: 1px solid var(--my-alpha-dark-gray-color);
        }

        .my-navbar .my-container {
            padding-top: 0;
            padding-bottom: 1rem;
        }

        .navbar-content {
            margin-top: 0;
        }

        @media (max-width: 576px) {
            .my-navbar .dropdown-menu {
                margin-bottom: .5rem;
            }
        }


        .tab-content {
            margin-top: 1rem;
        }

        /* ========== COMPONENTS ========== */
        .bi {
            fill: currentColor;
            width: 1em;
            height: 1em;
        }

        .my-text-heading {
            color: var(--my-heading-color);
        }

        .my-text-content {
            color: var(--my-content-color);
        }

        .my-step-counter {
            display: block;
            color: rgb(33, 178, 185);
            font-weight: 500;
            font-size: 2.5rem;
            user-select: none;
        }

        .my-step-counter::after {
            content: counter(step-counter);
            counter-increment: step-counter;
        }

        .my-tab-pane {
            counter-reset: step-counter 0;
        }

        /* ========== CONTENT BLOCKS ========== */
        .my-block,
        .my-block-big {
            border-radius: var(--bs-border-radius-xl);
            background-color: var(--my-gray-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .my-block {
            padding: 1rem;
        }

        .my-block .bi {
            font-size: 1.5rem;
        }

        .my-block-big {
            padding: 1.25rem;
            padding-top: 0.5rem;
        }

        .my-block-big h5 {
            font-size: 1.35rem;
        }

        .my-block-big p {
            font-size: 1.0625rem;
        }

        /* ========== NAVIGATION ========== */
        .my-nav-link,
        .my-nav-outline {
            display: flex;
            align-items: center;
        }

        .my-nav-link:focus-visible,
        .my-nav-outline:focus-visible {
            border-radius: var(--bs-border-radius-lg);
            box-shadow: 0 0 0 .25rem var(--my-alpha-gray-color);
        }

        .my-nav-link .bi,
        .my-nav-outline .bi {
            margin-right: .5rem;
            font-size: 1.25rem;
        }

        .my-nav-link-text {
            margin-right: auto;
        }

        .my-nav-outline {
            --bs-nav-link-padding-x: .85rem;
            --bs-nav-link-padding-y: .25rem;
            --bs-nav-link-color: #fff;
            --bs-nav-link-hover-color: #fff;
            background-color: rgb(28, 154, 160);
            border: 1px solid rgb(28, 154, 160);
            border-radius: var(--bs-border-radius-lg);
        }

        .my-nav-outline:not(.my-nav-secondary) {
            --bs-nav-link-color: #fff !important;
            color: #fff !important;
        }

        .my-nav-outline:not(.my-nav-secondary):hover,
        .my-nav-outline:not(.my-nav-secondary).show {
            --bs-nav-link-color: #fff !important;
            background-color: rgb(23, 130, 135);
            border-color: rgb(23, 130, 135);
            color: #fff !important;
        }

        .my-nav-outline:not(.my-nav-secondary) *,
        .my-nav-outline:not(.my-nav-secondary):hover *,
        .my-nav-outline:not(.my-nav-secondary).show * {
            color: #fff !important;
        }

        .my-nav-outline.my-nav-secondary {
            --bs-nav-link-color: var(--my-heading-color);
            background-color: var(--my-dropdown-bg);
            border-color: var(--my-alpha-dark-gray-color);
            color: var(--my-heading-color) !important;
        }

        .my-nav-outline.my-nav-secondary:hover,
        .my-nav-outline.my-nav-secondary.show {
            background-color: var(--my-gray-color);
            border-color: var(--my-alpha-dark-gray-color);
            color: var(--my-heading-color) !important;
        }

        .my-nav-outline.my-nav-secondary *,
        .my-nav-outline.my-nav-secondary:hover *,
        .my-nav-outline.my-nav-secondary.show * {
            color: var(--my-heading-color) !important;
        }

        /* ========== DROPDOWN ========== */
        .dropdown-toggle::after {
            mask: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8.7 13.7c.4-.4 1.1-.4 1.5 0l6 6 6-6c.4-.4 1.1-.4 1.5 0s.4 1.1 0 1.5L17 21.9c-.4.4-1.1.4-1.5 0l-6.7-6.7c-.5-.6-.5-1.1-.1-1.5'/%3E%3C/svg%3E") 50% 50% / cover no-repeat;
            float: right;
            width: 1em;
            height: 1.25em;
            margin-right: -3px;
            margin-left: 3px;
            background-color: currentColor;
            transform: rotate(0deg);
            transition: transform 0.2s ease;
        }

        .dropdown-toggle.show::after,
        .dropdown-toggle[aria-expanded="true"]::after {
            transform: rotate(180deg);
        }

        .my-dropdown .dropdown-menu {
            --bs-dropdown-padding-x: .25rem;
            --bs-dropdown-padding-y: .25rem;
            --bs-dropdown-spacer: .5rem;
            --bs-dropdown-bg: var(--my-dropdown-bg);
            --bs-dropdown-border-color: var(--my-alpha-dark-gray-color);
            --bs-dropdown-border-radius: var(--bs-border-radius-lg);
            --bs-dropdown-link-color: var(--my-heading-color);
            --bs-dropdown-link-hover-color: var(--my-heading-color);
            --bs-dropdown-link-hover-bg: var(--my-dropdown-link-hover-bg);
            --bs-dropdown-link-active-color: var(--my-heading-color);
            --bs-dropdown-link-active-bg: var(--my-dropdown-bg);
            --bs-dropdown-item-padding-x: 1rem;
            --bs-dropdown-item-padding-y: .5rem;
            --bs-dropdown-item-border-radius: var(--bs-border-radius);
            box-shadow: 0 .25rem 1rem rgba(0, 0, 0, .175);
        }

        .my-dropdown .dropdown-item {
            display: flex;
            align-items: center;
        }

        .my-dropdown .dropdown-item span {
            margin-right: 2rem;
        }

        .my-dropdown .dropdown-item.active:hover,
        .my-dropdown .dropdown-item:hover:active {
            background-color: var(--my-dropdown-link-hover-bg);
        }

        .my-dropdown .my-dropdown-item-icon {
            margin-right: .5rem;
            color: var(--my-alpha-gray-color);
        }

        .my-dropdown .my-dropdown-item-check {
            margin-left: auto;
            color: transparent;
        }

        .my-dropdown .active .my-dropdown-item-check {
            color: var(--my-heading-color);
        }

        /* ========== BUTTONS ========== */
        .my-btn-primary,
        .my-btn-outline {
            --bs-btn-padding-x: .85rem;
            --bs-btn-padding-y: .25rem;
            --bs-btn-color: #fff;
            --bs-btn-border-radius: var(--bs-border-radius-lg);
            --bs-btn-hover-color: #fff;
            --bs-btn-active-color: #fff;
            --bs-btn-active-border-color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .my-btn-primary {
            --bs-btn-bg: rgb(28, 154, 160);
            --bs-btn-hover-bg: rgb(23, 130, 135);
            --bs-btn-focus-shadow-rgb: 25, 125, 225;
            --bs-btn-active-bg: rgb(18, 106, 110);
        }

        .my-btn-primary .bi,
        .my-btn-outline .bi {
            margin-right: 0.35rem;
            font-size: 1.1em;
            flex-shrink: 0;
        }

        .my-btn-outline {
            --bs-btn-color: var(--my-heading-color);
            --bs-btn-bg: var(--my-dropdown-bg);
            --bs-btn-border-color: var(--my-alpha-dark-gray-color);
            --bs-btn-hover-color: var(--my-heading-color);
            --bs-btn-hover-bg: var(--my-dropdown-bg);
            --bs-btn-hover-border-color: var(--my-alpha-dark-gray-color);
            --bs-btn-focus-shadow-rgb: var(--my-emphasis-focus-shadow-rgb);
            --bs-btn-active-color: var(--my-heading-color);
            --bs-btn-active-bg: var(--my-dropdown-bg);
            --bs-btn-active-border-color: var(--my-alpha-dark-gray-color);
        }

        @media (hover: hover) and (pointer: fine) {
            .my-btn-outline {
                --bs-btn-hover-color: var(--my-heading-color);
                --bs-btn-hover-bg: var(--my-gray-color);
                --bs-btn-hover-border-color: var(--my-alpha-dark-gray-color);
                --bs-btn-active-color: var(--my-heading-color);
                --bs-btn-active-bg: var(--my-gray-color);
                --bs-btn-active-border-color: var(--my-alpha-dark-gray-color);
            }
        }

        /* ========== ADAPTABILITY ========== */
        @media (max-width: 576px) {
            .my-block-big {
                padding: 1rem;
                padding-top: 0.25rem;
            }
        }

        @media (max-width: 320px) {
            .my-row-xs>* {
                width: 100%;
            }
        }

        /* ========== SCREENSHOTS ========== */
        .my-screenshots {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }

        .my-screenshot {
            flex: 0 0 calc(50% - .5rem);
            margin: 0;
        }

        @media (min-width: 576px) {
            .my-screenshot {
                flex-basis: 180px;
            }
        }

        .my-screenshot img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid var(--my-alpha-dark-gray-color);
            border-radius: var(--bs-border-radius-lg);
        }

        .my-screenshot figcaption {
            margin-top: .5rem;
            font-size: .875rem;
            color: var(--my-content-color);
        }

        /* ========== LIGHTBOX ========== */
        .my-lightbox {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1060;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(4rem + env(safe-area-inset-top, 0px)) 1rem calc(1rem + env(safe-area-inset-bottom, 0px));
            background-color: rgba(0, 0, 0, .85);
            cursor: zoom-out;
            overscroll-behavior: contain;
        }

        .my-lightbox[hidden] {
            display: none;
        }

        .my-lightbox img {
            max-width: 100%;
            max-height: 100%;
            border-radius: var(--bs-border-radius-lg);
        }

        .my-lightbox-close {
            position: absolute;
            top: calc(.75rem + env(safe-area-inset-top, 0px));
            right: .75rem;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
            background-color: #2c2c2c;
            color: #fff;
        }

        .my-lightbox-close .bi {
            font-size: 1.125rem;
        }

        /* ========== MODAL ========== */
        .modal-backdrop {
            --bs-backdrop-opacity: .75;
        }

        .my-modal {
            --bs-modal-margin: 1rem;
            --bs-modal-bg: var(--my-modal-bg);
            --bs-modal-border-width: 1px;
            --bs-modal-border-color: var(--my-alpha-dark-gray-color);
            --bs-modal-border-radius: var(--bs-border-radius-xl);
            --bs-modal-padding: 1.5rem;
        }

        .my-modal .modal-dialog {
            max-width: 420px;
        }

        .my-modal .modal-content {
            position: relative;
        }

        .my-modal .btn-close {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            z-index: 1;
        }

        .my-modal .modal-body h5 {
            margin-bottom: .75rem;
        }

        .my-modal .modal-body p {
            margin-bottom: 1.25rem;
        }

    </style>
</head>

    <script>
        const SUB_URL_SCHEMES = {
            pc: happUrl,
            android: happUrl,
            ios: happUrl,
            macos: happUrl,
        };

        function getTabIdByDevice() {
            const userAgent = navigator.userAgent.toLowerCase();
            const isIpadOS = userAgent.includes('macintosh') && navigator.maxTouchPoints > 1;
            if (userAgent.includes('android')) {
                return '#tab-android';
            } else if (userAgent.includes('iphone') || userAgent.includes('ipad') || userAgent.includes('ipod') || isIpadOS) {
                return '#tab-ios';
            } else if (userAgent.includes('mac os x') || userAgent.includes('macintosh')) {
                return '#tab-macos';
            } else {
                return '#tab-pc';
            }
        }

        function setActivePlatform(item) {
            if (!item) return;
            const btn = document.getElementById('btn-guide');

            const tabPane = document.querySelector(item.dataset.bsTarget);
            if (tabPane) {
                document.querySelectorAll('.tab-pane').forEach(pane => {
                    pane.classList.remove('show', 'active');
                });
                tabPane.classList.add('show', 'active');
            }

            document.querySelectorAll('.my-dropdown-item-guide').forEach(el => {
                const isActive = el === item;
                el.classList.toggle('active', isActive);
                el.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });

            const btnIcon = btn && btn.querySelector('.my-nav-link-icon use');
            const itemIcon = item.querySelector('.my-dropdown-item-icon use');
            if (btnIcon && itemIcon) {
                btnIcon.setAttribute('href', itemIcon.getAttribute('href'));
            }

            const btnText = btn && btn.querySelector('.my-nav-link-text');
            const itemText = item.querySelector('span');
            if (btnText && itemText) {
                btnText.replaceChildren(itemText.cloneNode(true));
            }
        }

        (function initPlatform() {
            document.querySelectorAll('.my-dropdown-item-guide').forEach(item => {
                item.addEventListener('click', () => setActivePlatform(item));
            });

            const selectedItem =
                document.querySelector(`.my-dropdown-item-guide[data-bs-target="${getTabIdByDevice()}"]`)
                || document.querySelector('.my-dropdown-item-guide.active');
            setActivePlatform(selectedItem);

            for (const [os, url] of Object.entries(SUB_URL_SCHEMES)) {
                const element = document.getElementById(`sub-url-${os}`);
                if (element) {
                    element.href = url;
                }
            }
        })();

        (function initRegionPage() {
            let openedFromPage = false;
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = lightbox.querySelector('img');

            function hideLightbox() {
                lightbox.hidden = true;
                lightboxImg.removeAttribute('src');
                document.body.style.overflow = '';
            }

            function closeLightbox() {
                if (history.state && history.state.lightbox) {
                    history.back();
                } else {
                    hideLightbox();
                }
            }

            function showPage() {
                hideLightbox();
                const isRegion = location.hash === '#region';
                document.getElementById('page-main').hidden = isRegion;
                document.getElementById('page-region').hidden = !isRegion;
                document.getElementById('nav-support').hidden = isRegion;
                document.getElementById('nav-guide').hidden = isRegion;
                document.getElementById('nav-back').hidden = !isRegion;
                window.scrollTo(0, 0);
            }

            document.querySelectorAll('a[href="#region"]').forEach(link => {
                link.addEventListener('click', () => { openedFromPage = true; });
            });

            function goBack() {
                if (openedFromPage) {
                    openedFromPage = false;
                    history.back();
                } else {
                    history.replaceState(null, '', location.pathname + location.search);
                    showPage();
                }
            }

            document.getElementById('btn-back').addEventListener('click', goBack);
            document.getElementById('btn-back-step').addEventListener('click', goBack);

            document.getElementById('btn-region-instruction').addEventListener('click', event => {
                const instruction = document.getElementById('region-instruction');
                instruction.hidden = !instruction.hidden;
                event.currentTarget.classList.toggle('active', !instruction.hidden);
                event.currentTarget.setAttribute('aria-pressed', String(!instruction.hidden));
            });

            document.querySelectorAll('.my-screenshot a').forEach(link => {
                link.addEventListener('click', event => {
                    event.preventDefault();
                    lightboxImg.src = link.href;
                    lightbox.hidden = false;
                    document.body.style.overflow = 'hidden';
                    history.pushState({ lightbox: true }, '');
                });
            });

            lightbox.addEventListener('click', closeLightbox);
            window.addEventListener('popstate', () => {
                if (!lightbox.hidden) hideLightbox();
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
            });

            window.addEventListener('hashchange', showPage);
            showPage();
        })();
    </script>

        function getUserLocale() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang === 'en' || urlLang === 'ru') return urlLang;

            try {
                const tgLang = window.Telegram?.WebApp?.initDataUnsafe?.user?.language_code;
                if (tgLang) return tgLang.startsWith('ru') ? 'ru' : 'en';
            } catch (e) {
                console.warn('Telegram error:', e);
            }

            const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            const russianLanguageCodes = ['ru', 'ru-ru', 'ru_ru', 'by', 'kz', 'kg', 'uz'];
            return russianLanguageCodes.some(code => browserLang.includes(code)) ? 'ru' : 'en';
        }

        document.addEventListener('alpine-i18n:ready', () => {
            window.AlpineI18n.fallbackLocale = 'en';
            window.AlpineI18n.create(getUserLocale(), MESSAGES);
        });

        document.addEventListener('alpine:init', () => {
            Alpine.data('androidCopyLink', () => ({
                isLinkCopied: false,
                async copySubscriptionLink() {
                    const subscriptionUrl = cleanUrl;
                    
                    try {
                        await navigator.clipboard.writeText(subscriptionUrl);
                        this.isLinkCopied = true;
                        setTimeout(() => {
                            this.isLinkCopied = false;
                        }, 3000);
                    } catch (err) {
                        console.error('Failed to copy:', err);
                        const tempInput = document.createElement('input');
                        tempInput.value = subscriptionUrl;
                        document.body.appendChild(tempInput);
                        tempInput.select();
                        document.execCommand('copy');
                        document.body.removeChild(tempInput);
                        this.isLinkCopied = true;
                        setTimeout(() => {
                            this.isLinkCopied = false;
                        }, 3000);
                    }
                }
            }));
        });

        document.addEventListener('alpine:initialized', () => {
            setActivePlatform(document.querySelector('.my-dropdown-item-guide.active'));
        });

        setTimeout(() => {
            if (window.AlpineI18n) return;
            const locale = getUserLocale();
            const msgs = MESSAGES[locale] || MESSAGES[DEFAULT_LOCALE];
            const resolve = (key) => key.split('.').reduce((o, k) => o?.[k], msgs);
            document.querySelectorAll('[x-text]').forEach(el => {
                const key = el.getAttribute('x-text').replace(/^\$t\('(.+)'\)$/, '$1');
                const val = resolve(key);
                if (val) el.textContent = val;
            });
            document.querySelectorAll('[x-html]').forEach(el => {
                const key = el.getAttribute('x-html').replace(/^\$t\('(.+)'\)$/, '$1');
                const val = resolve(key);
                if (val) el.innerHTML = val;
            });
        }, 4000);
    </script>
